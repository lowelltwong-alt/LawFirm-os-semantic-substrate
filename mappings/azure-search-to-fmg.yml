mapping_id: azure-search-to-fmg-v1
mapping_version: 1.0.0
status: draft
draft_mode: explicit_scaffold
draft_reason: only high-level query/filter/score concepts are plausible; exact Azure AI Search payload fields remain unverified in repo evidence
evidence_status: missing_source_evidence
readiness_status: blocked_pending_source_payload_evidence
source_system: azure-ai-search
purpose: >
  Normalize Azure AI Search indexing and query behavior into FMG retrieval
  request, trace, response, and index migration contracts.
canonical_boundary:
  canonical_objects_only: false
  vendor_local_semantics_authoritative: false
  canonical_source_boundaries_may_change: false
source_entities:
  - entity: SOURCE_ENTITY_REQUIRED
    assumption_status: unverified_scaffold
    verification_note: TODO_EVIDENCE exact index object name and index settings envelope
    derived_objects:
      - index-build
      - index-migration-plan
  - entity: SOURCE_ENTITY_REQUIRED
    assumption_status: unverified_scaffold
    verification_note: TODO_EVIDENCE exact query and result envelope object name
    derived_objects:
      - retrieval-request
      - retrieval-trace
      - retrieval-response
field_mappings:
  - source_field: SOURCE_FIELD_REQUIRED
    assumption_status: unverified_scaffold
    verification_note: TODO_EVIDENCE exact search text field name
    target_object: retrieval-request
    target_path: query_text
    mapping_mode: transformed
  - source_field: SOURCE_FIELD_REQUIRED
    assumption_status: unverified_scaffold
    verification_note: TODO_EVIDENCE exact filter field name and syntax
    target_object: retrieval-trace
    target_path: policy_enforcement.adapter_filter_expression
    mapping_mode: transformed
  - source_field: SOURCE_FIELD_REQUIRED
    assumption_status: unverified_scaffold
    verification_note: TODO_EVIDENCE result field carrying FMG chunk identifiers
    target_object: retrieval-response
    target_path: ranked_results[].chunk_id
    mapping_mode: transformed
  - source_field: SOURCE_FIELD_REQUIRED
    assumption_status: unverified_scaffold
    verification_note: TODO_EVIDENCE result field carrying FMG document-version identifiers
    target_object: retrieval-response
    target_path: ranked_results[].document_version_id
    mapping_mode: transformed
  - source_field: SOURCE_FIELD_REQUIRED
    assumption_status: unverified_scaffold
    verification_note: TODO_EVIDENCE exact score field and score family emitted by results
    target_object: retrieval-trace
    target_path: result_trace[].scores
    mapping_mode: transformed
verification_inputs_required:
  - live Azure AI Search request payload
  - live Azure AI Search response payload
  - index definition export
notes:
  - Search scores, semantic rerankers, and vector configuration remain derived.
  - FMG document versions, components, and span selectors remain the evidence authority.
  - Exact Azure AI Search source field names remain placeholders until real exports confirm them.
