name: Validate Governed Learning

on:
  push:
    paths:
      - 'schemas/**'
      - 'examples/**'
      - 'scripts/validate_governed_learning_examples.py'
      - '.github/workflows/validate-governed-learning.yml'
  pull_request:
    paths:
      - 'schemas/**'
      - 'examples/**'
      - 'scripts/validate_governed_learning_examples.py'
      - '.github/workflows/validate-governed-learning.yml'

jobs:
  validate-governed-learning:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install jsonschema

      - name: Validate governed learning examples
        run: python scripts/validate_governed_learning_examples.py
