name: Phase 3 Provenance Minimum

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  phase3-provenance-minimum:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate provenance minimum
        run: python scripts/phase3/validate_provenance_minimum.py
