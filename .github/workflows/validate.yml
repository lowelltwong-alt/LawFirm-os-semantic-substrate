name: validate
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validation dependencies and package
        run: |
          python -m pip install --upgrade pip
          python -m pip install "setuptools>=68" wheel
          python -m pip install -r requirements-dev.txt
          python -m pip install -e . --no-build-isolation
      - name: Run unit tests
        run: python -m unittest discover -s scripts/validation/tests -p 'test_*.py'
      - name: Validate governance dependency map
        run: python scripts/validate_governance_dependency_map.py --map-updated true
      - name: Validate source-of-truth coherence
        run: python scripts/validation/validate_source_of_truth_coherence.py
      - name: Run repo drift check
        run: python scripts/check_repo_drift.py
      - name: Run CLI smoke check
        run: fmg release-snapshot --version 0.1.0-poc
      - name: Upload POC release snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fmg-release-snapshot-0.1.0-poc
          path: release-snapshots/0.1.0-poc
