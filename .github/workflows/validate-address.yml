name: Validate Address System

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  validate-address:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install jsonschema

      - name: Run address enforcement
        run: python scripts/enforce_address_across_objects.py
