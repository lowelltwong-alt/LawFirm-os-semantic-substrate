name: Validate Phase 2 Schema Layer

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  validate-schema:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Run substrate schema validation
        run: python scripts/validation/validate_schema.py
      - name: Validate DNA invariant coverage
        run: python scripts/validation/validate_dna_invariants.py

