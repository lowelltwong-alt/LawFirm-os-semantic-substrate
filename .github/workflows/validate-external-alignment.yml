name: Validate External Alignment

on:
  pull_request:
  push:
    branches: [ "main" ]

jobs:
  validate-external-alignment:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Parse all repository YAML
        run: python scripts/validation/check_repo_yaml.py

      - name: Validate external alignment scaffold
        run: python scripts/validation/validate_external_alignment.py

      - name: Validate external alignment strict
        run: python scripts/validation/validate_external_alignment_strict.py

      - name: Validate interop mappings
        run: python scripts/validation/validate_interop_mappings.py
