name: Validate Repository vNext

on:
  push:
    paths:
      - 'schemas/**'
      - 'examples/**'
      - 'registry/**'
      - 'scripts/validate_repository_vnext.py'
      - '.github/workflows/validate-repository-vnext.yml'
  pull_request:
    paths:
      - 'schemas/**'
      - 'examples/**'
      - 'registry/**'
      - 'scripts/validate_repository_vnext.py'
      - '.github/workflows/validate-repository-vnext.yml'

jobs:
  validate-repository-vnext:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install jsonschema

      - name: Run umbrella repository validation
        run: python scripts/validate_repository_vnext.py
