name: Phase 4 Comparison Assessment

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  phase4-comparison-assessment:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Check comparison assessments
        run: python scripts/phase4/check_comparison_assessments.py
