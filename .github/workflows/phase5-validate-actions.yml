name: Phase 5 Validate Actions

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  phase5-validate-actions:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate action types
        run: python scripts/phase5/validate_action_types.py
