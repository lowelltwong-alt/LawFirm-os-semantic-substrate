profile_id: imanage-document-v1
profile_version: 1.0.0
status: draft
draft_mode: explicit_scaffold
draft_reason: only generic document and version concepts are plausible; exact iManage metadata field names remain unverified in repo evidence
evidence_status: missing_source_evidence
readiness_status: blocked_pending_source_payload_evidence
owner: document-platform
provider: imanage
service: document
purpose: >
  Map iManage document and workspace metadata into Law Firm canonical document,
  version, and access-scoping objects without turning workspace taxonomy into
  canonical semantics.
source_entity_assumptions:
  - entity: SOURCE_ENTITY_REQUIRED
    assumption_status: unverified_scaffold
    verification_note: TODO_EVIDENCE exact document metadata object name
  - entity: SOURCE_ENTITY_REQUIRED
    assumption_status: unverified_scaffold
    verification_note: TODO_EVIDENCE exact version metadata object name
  - entity: SOURCE_ENTITY_REQUIRED
    assumption_status: unverified_scaffold
    verification_note: TODO_EVIDENCE exact workspace metadata object name
  - entity: SOURCE_ENTITY_REQUIRED
    assumption_status: unverified_scaffold
    verification_note: TODO_EVIDENCE custom metadata field dictionary
emits_canonical_objects:
  - document
  - source-artifact
  - document-version
emits_policy_objects:
  - access-decision
boundary_controls:
  local_semantics_authoritative: false
  may_redefine_canonical_boundaries: false
  exact_source_traceability_required: true
  deny_by_default_required: true
field_mappings:
  - source_field: SOURCE_FIELD_REQUIRED
    assumption_status: unverified_scaffold
    verification_note: TODO_EVIDENCE exact document identifier field name
    target_object: source-artifact
    target_field: source_identifier
    mapping_mode: transformed
  - source_field: SOURCE_FIELD_REQUIRED
    assumption_status: unverified_scaffold
    verification_note: TODO_EVIDENCE exact title field name
    target_object: document
    target_field: title
    mapping_mode: transformed
  - source_field: SOURCE_FIELD_REQUIRED
    assumption_status: unverified_scaffold
    verification_note: TODO_EVIDENCE workspace or custom field used for matter scoping
    target_object: document
    target_field: matter_refs[]
    mapping_mode: transformed
  - source_field: SOURCE_FIELD_REQUIRED
    assumption_status: unverified_scaffold
    verification_note: TODO_EVIDENCE exact version label field name
    target_object: document-version
    target_field: version_identifier
    mapping_mode: transformed
  - source_field: SOURCE_FIELD_REQUIRED
    assumption_status: unverified_scaffold
    verification_note: TODO_EVIDENCE workspace or custom field used for confidentiality mapping
    target_object: access-decision
    target_field: target_ref.confidentiality_class
    mapping_mode: transformed
verification_inputs_required:
  - iManage document metadata export
  - version lineage export
  - workspace metadata export
  - custom field dictionary
notes:
  - iManage workspace and custom field taxonomies remain local source metadata.
  - Law Firm canonical document identity and access policy remain governed locally.
  - Access decisions remain policy objects and must not be treated as canonical document semantics.
  - Exact iManage source object and field names remain placeholders until metadata exports are available.
