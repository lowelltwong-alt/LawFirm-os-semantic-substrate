profile_id: sharepoint-gold-standard-v1
profile_version: 1.0.0
status: scaffold
draft_mode: explicit_scaffold
draft_reason: SharePoint library restrictions and curated-status fields are unverified in repo evidence and the gold-standard asset family is not yet active
evidence_status: missing_source_evidence
readiness_status: blocked_pending_evidence_and_architecture_decision
owner: document-platform
provider: sharepoint
service: gold-standard
purpose: >
  Map curated SharePoint exemplar libraries into Law Firm canonical document objects
  and policy-aware eligibility signals without introducing a vendor-local
  ontology for exemplar meaning.
source_entity_assumptions:
  - entity: site
    assumption_status: inferred_draft
    verification_note: TODO_VERIFY_WITH_REAL_EXPORT exact site metadata object name
  - entity: library
    assumption_status: inferred_draft
    verification_note: TODO_VERIFY_WITH_REAL_EXPORT exact library metadata object name
  - entity: file
    assumption_status: inferred_draft
    verification_note: TODO_VERIFY_WITH_REAL_EXPORT exact file metadata object name
  - entity: SOURCE_ENTITY_REQUIRED
    assumption_status: unverified_scaffold
    verification_note: TODO_VERIFY_WITH_REAL_EXPORT metadata structure carrying curated or restricted status
emits_canonical_objects:
  - document
  - source-artifact
  - document-version
emits_policy_objects:
  - access-decision
boundary_controls:
  local_semantics_authoritative: false
  may_create_local_semantic_forks: false
  exact_source_traceability_required: true
field_mappings:
  - source_field: SOURCE_FIELD_REQUIRED
    assumption_status: unverified_scaffold
    verification_note: TODO_VERIFY_WITH_REAL_EXPORT source identifier field for SharePoint file identity
    target_object: source-artifact
    target_field: source_identifier
    mapping_mode: transformed
  - source_field: file.name
    assumption_status: inferred_draft
    verification_note: TODO_VERIFY_WITH_REAL_EXPORT exact file display-name field
    target_object: document
    target_field: title
    mapping_mode: exact
  - source_field: SOURCE_FIELD_REQUIRED
    assumption_status: unverified_scaffold
    verification_note: TODO_VERIFY_WITH_REAL_EXPORT SharePoint restriction or policy reference field; raw library names must not become Law Firm policy refs
    target_object: access-decision
    target_field: policy_basis.source_policy_refs[]
    mapping_mode: transformed
  - source_field: SOURCE_FIELD_REQUIRED
    assumption_status: unverified_scaffold
    verification_note: TODO_VERIFY_WITH_REAL_EXPORT field used to capture curated or approved exemplar status
    target_object: document-version
    target_field: TODO_TARGET_FIELD_REQUIRED_CURRENT_DOCUMENT_VERSION_SCHEMA
    mapping_mode: transformed
verification_inputs_required:
  - SharePoint file metadata export
  - library or site restriction export
  - curated library field dictionary
notes:
  - This profile remains draft because the canonical gold-standard asset family is not yet active.
  - SharePoint labels may inform policy evaluation but do not define Law Firm policy references or canonical meaning.
  - TODO_EVIDENCE: confirm whether curated-status belongs on a future gold-standard asset contract rather than document-version.
