schema_set_id: enterprise_doctrinal_comparison_substrate
version: 0.1.0
status: draft
phase: 1
owner: Lowell T. Wong
description: >
  Machine-readable Phase 1 substrate for enterprise doctrinal comparison,
  aligned to the current FMG fractal ontology shell and prepared for later
  JSON Schema, SHACL, and LinkML hardening.
compatibility:
  source_of_truth: registry/source-of-truth.json
  design_authority: registry/design-authority.json
  canonical_address: governance/CANONICAL_ADDRESS_CONSTITUTION.md
  claim_contract: governance/CLAIM_SCHEMA.md
  metadata_standard: standards/metadata-standard.md
  repo_schema_layer: schemas/
  trust_zone_strategy: reuse current canonical trust-zone vocabulary
  inference_policy: reuse asserted, derived, and hypothesis separation
  shell_policy: preserve stable shell and avoid parallel ontology grammar
directories:
  interfaces: schema/interfaces
  types: schema/types
  enums: schema/enums
  contracts: schema/contracts
  docs: docs/roadmap
phase_1_scope:
  - define reusable interfaces
  - define doctrinal comparison type seeds
  - define controlled vocab seeds compatible with current governance
  - prepare later schema hardening without changing current runtime schemas
phase_2_targets:
  - add JSON Schema and LinkML mappings
  - add SHACL constraints for graph-facing types
  - add registry integration and canonical ID prefix policy
  - add canonical examples aligned to current address shell
  - add validation hooks and compatibility checks
phase_3_targets:
  - add first-class assertion and provenance object layers
  - add graph partition governance and validation
  - add quarantine and boundary separation scaffolding
phase_4_targets:
  - add governed alignment assessment objects
  - add rubric enums for scope, translation burden, and evidence sufficiency
  - add comparison assessment validation and workflow checks
  - keep comparison judgments machine-readable without false numeric precision
phase_5_targets:
  - add governed action, action-log, object-set, and pilot-slice types
  - add reviewer-role and operational lifecycle scaffolding
  - add bounded pilot slice seed data and workflow checks
  - make doctrinal substrate operational without broad doctrinal population
phase_6_targets:
  - add semantic graph execution contracts for JSON-LD and named-graph packaging
  - add SHACL and semantic validation scaffolding without changing canonical gates
  - add property-graph projection contracts for governed downstream exports
  - add retrieval feedback and proposal-promotion sidecars for bounded iteration
  - add intake-conflicts-ai pilot artifacts proving semantic stack composition
