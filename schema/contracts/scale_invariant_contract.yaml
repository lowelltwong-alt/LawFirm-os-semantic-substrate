kind: scale_invariant_contract
id: scale_invariant_contract
version: 0.1.0
status: draft
required_invariants: &required_invariants
  - identity
  - boundary
  - state_transition
  - evidence
  - governance
  - feedback
levels:
  micro:
    description: Atomic entities and witness-level observations.
    required_invariants: *required_invariants
  meso:
    description: Operational objects that aggregate and govern bounded workflows.
    required_invariants: *required_invariants
  macro:
    description: Program-level manifests, projections, and enterprise governance artifacts.
    required_invariants: *required_invariants

default_projection: &default_projection
  parent_level_mapping:
    meso: summarize_required_invariants
    macro: aggregate_required_invariants
  child_projection_mapping:
    micro: decompose_required_invariants
    meso: package_required_invariants
  invariant_preservation_rules:
    identity: preserve stable id/object_type/title semantics through projection transforms
    boundary: preserve explicit authority and ontology boundary constraints
    state_transition: preserve lifecycle and review transition traceability
    evidence: preserve citable evidence and provenance linkages
    governance: preserve governing policy and approval references
    feedback: preserve retrieval and decision feedback channels

major_object_types:
